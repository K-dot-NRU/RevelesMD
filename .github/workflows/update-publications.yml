name: Update publications from Google Scholar

on:
  schedule:
    - cron: "17 4 * * 1,4"   # Mondays and Thursdays, early morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::scholar
            any::yaml
            any::jsonlite
      - name: Import from Google Scholar
        run: Rscript R/update_publications.R
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.yml
          git diff --cached --quiet || git commit -m "Update publications from Google Scholar"
          git push
